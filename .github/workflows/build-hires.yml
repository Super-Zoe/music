name: 构建 arm64 release APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
    # 纯文档改动不必触发构建
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.imgs/**'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.imgs/**'
  workflow_dispatch:
    inputs:
      with_ffmpeg:
        description: '打进自编译的 FFmpeg（需要已运行过 build-ffmpeg.yml 并发布到 release）'
        required: false
        default: true
        type: boolean
      ffmpeg_url:
        description: 'Jellyfin FFmpeg Android 产物压缩包地址（留空则用 release 里的成品）'
        required: false
        type: string
      ffmpeg_sha256:
        description: '产物 SHA256（可选）'
        required: false
        type: string

concurrency:
  group: hires-build-${{ github.ref }}
  cancel-in-progress: true

# 发布 Release / 上传 asset 需要 contents: write，
# 否则 GITHUB_TOKEN 只有读权限，会报 HTTP 403 Resource not accessible by integration
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读取版本号
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "版本: $VERSION ($(git rev-parse --short HEAD))"

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 安装依赖
        run: npm ci --prefer-offline --no-audit

      - name: 解码逻辑测试
        run: node --experimental-strip-types scripts/run-decode-tests.mjs

      # FFmpeg 二进制：优先用 release 里已编译好的成品（由 build-ffmpeg.yml 发布），
      # 也可用变量指定外部压缩包（交给 fetch 脚本做 sha256 校验与解包）。
      # 两者都拿不到时不算失败，仍然构建出与上游功能一致的 APK。
      - name: 准备 Android FFmpeg 二进制
        id: ffmpeg
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FFMPEG_ABIS: arm64-v8a
        run: |
          set -euo pipefail
          if [ -n "${{ vars.FFMPEG_ANDROID_URL }}" ]; then
            echo "使用 vars.FFMPEG_ANDROID_URL 指定的产物"
            node scripts/fetch-jellyfin-ffmpeg.mjs \
              --abi "$FFMPEG_ABIS" \
              --url "${{ vars.FFMPEG_ANDROID_URL }}"
          else
            echo "从 release tag ffmpeg-android 下载成品"
            for ABI in $FFMPEG_ABIS; do
              DEST="android/app/src/main/jniLibs/$ABI"
              mkdir -p "$DEST"
              gh release download ffmpeg-android \
                --pattern "libjellyfin_ffmpeg_$ABI.so" --dir "$DEST"
              mv "$DEST/libjellyfin_ffmpeg_$ABI.so" "$DEST/libjellyfin_ffmpeg.so"
              chmod 755 "$DEST/libjellyfin_ffmpeg.so"
            done
          fi
          ls -lh android/app/src/main/jniLibs/*/

      - name: 解码能力标记
        run: |
          if [ -f android/app/src/main/jniLibs/arm64-v8a/libjellyfin_ffmpeg.so ]; then
            echo "- FFmpeg: **已集成**（arm64-v8a）" >> $GITHUB_STEP_SUMMARY
          else
            echo "- FFmpeg: 未集成，本次 APK 的解码能力与上游一致" >> $GITHUB_STEP_SUMMARY
          fi

      # 签名：有仓库机密就用正式签名，否则现场生成一份 CI 自签密钥，
      # 保证 assembleRelease 永远不会因为缺少 keystore 而失败。
      - name: 配置签名
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "使用仓库机密中的正式签名密钥"
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            cat > android/keystore.properties <<EOF
          RELEASE_STORE_FILE=release.keystore
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF
          else
            echo "::warning::未配置签名机密，改用 CI 临时自签密钥（仅供下载安装，不可用于发布渠道）"
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -storetype JKS \
              -alias hires-ci -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass hires-ci -keypass hires-ci \
              -dname "CN=MusicFree HiRes CI, OU=CI, O=MusicFree-HiRes"
            cat > android/keystore.properties <<EOF
          RELEASE_STORE_FILE=release.keystore
          RELEASE_STORE_PASSWORD=hires-ci
          RELEASE_KEY_ALIAS=hires-ci
          RELEASE_KEY_PASSWORD=hires-ci
          EOF
          fi
          chmod 600 android/keystore.properties android/app/release.keystore

      - name: Gradle 构建
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=768m" -Dfile.encoding=UTF-8
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --parallel --build-cache --configure-on-demand

      - name: 校验 arm64 产物
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::未找到 arm64 产物，实际生成的 APK："
            ls -lh android/app/build/outputs/apk/release/
            exit 1
          fi
          SIZE=$(du -h "$APK" | cut -f1)
          echo "产物: $APK ($SIZE)"
          echo "### 📱 构建产物" >> $GITHUB_STEP_SUMMARY
          echo "$(basename $APK) — $SIZE" >> $GITHUB_STEP_SUMMARY

      - name: 上传 arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: music-arm64-v8a-release
          path: android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          retention-days: 30

      - name: 上传其余 ABI 与通用包
        uses: actions/upload-artifact@v4
        with:
          name: music-other-abis
          path: |
            android/app/build/outputs/apk/release/*.apk
            !android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          retention-days: 7
          if-no-files-found: ignore

      # 无论怎么触发，都在 Release 里放一个可直接下载安装的 APK：
      # - 打 v* tag         → 发到该 tag 的正式 Release
      # - 普通 push / 手动构建 → 更新固定 tag apk-latest 的预发布（滚动更新）
      # 统一走 gh release upload --clobber，同名 asset 直接覆盖，重复构建不会失败。
      # apk-latest 不匹配 v* 规则，不会触发新的构建，不存在自循环。
      # PR（尤其 fork PR）没有写权限，跳过发布，只保留 artifact。
      - name: 发布可下载 APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          OUT="MusicFree-HiRes-arm64-v8a.apk"
          cp "$APK" "$OUT"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            EXTRA=()
            TITLE="MusicFree-HiRes ${{ github.ref_name }}"
          else
            TAG=apk-latest
            EXTRA=(--prerelease)
            TITLE="最新构建 APK（自动更新）"
          fi
          SIZE=$(du -h "$APK" | cut -f1)
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          NOTES="自动构建产物 · $OUT

          - 版本：${{ steps.ver.outputs.version }} (\`$(git rev-parse --short HEAD)\`)
          - 架构：arm64-v8a（绝大多数现役安卓机），大小 $SIZE
          - sha256：\`$SHA\`
          - FFmpeg：内置静态可执行 lib/arm64-v8a/libjellyfin_ffmpeg.so，支持 ALAC / APE / DSF / DFF
          - 触发：${{ github.event_name }} @ ${{ github.ref_name }}

          安装注意：未配置正式签名机密时为 CI 自签包，与官方 MusicFree 签名不同，
          需先卸载官方版再安装，不能覆盖升级。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$OUT" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" ${EXTRA[@]+"${EXTRA[@]}"} \
              --title "$TITLE" --target "$GITHUB_SHA" --notes "$NOTES" "$OUT"
          fi
          {
            echo ""
            echo "### 可下载安装"
            echo "- https://github.com/${{ github.repository }}/releases/tag/$TAG"
            echo "- $OUT — $SIZE — sha256 $SHA"
          } >> $GITHUB_STEP_SUMMARY

      - name: 构建摘要
        run: |
          {
            echo "✅ arm64 release APK 构建完成"
            echo "- 版本: ${{ steps.ver.outputs.version }}"
            echo "- 提交: ${{ steps.ver.outputs.sha }}"
            echo "- 分支: ${{ github.ref_name }}"
            echo "- 触发: ${{ github.event_name }}"
            if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
              echo "- 签名: CI 临时自签（建议配置 RELEASE_* 机密以获得正式签名）"
            fi
          } >> $GITHUB_STEP_SUMMARY
