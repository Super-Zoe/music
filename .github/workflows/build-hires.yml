name: 构建 HiRes APK

on:
  workflow_dispatch:
    inputs:
      ffmpeg_url:
        description: 'Jellyfin FFmpeg Android 产物压缩包地址（留空则构建不含解码扩展的版本）'
        required: false
        type: string
      ffmpeg_sha256:
        description: '产物 SHA256（可选）'
        required: false
        type: string
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 安装依赖
        run: npm ci --prefer-offline --no-audit

      - name: 解码逻辑测试
        run: node --experimental-strip-types scripts/run-decode-tests.mjs

      - name: 拉取 Jellyfin FFmpeg 产物
        if: ${{ inputs.ffmpeg_url != '' || vars.FFMPEG_ANDROID_URL != '' }}
        env:
          FFMPEG_URL: ${{ inputs.ffmpeg_url || vars.FFMPEG_ANDROID_URL }}
          FFMPEG_SHA256: ${{ inputs.ffmpeg_sha256 || vars.FFMPEG_ANDROID_SHA256 }}
        run: |
          ARGS="--abi arm64-v8a,armeabi-v7a --url $FFMPEG_URL"
          if [ -n "$FFMPEG_SHA256" ]; then ARGS="$ARGS --sha256 $FFMPEG_SHA256"; fi
          node scripts/fetch-jellyfin-ffmpeg.mjs $ARGS

      - name: 配置签名
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          cat > android/keystore.properties << 'EOF'
          RELEASE_STORE_FILE=release.keystore
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF
          chmod 600 android/keystore.properties android/app/release.keystore

      - name: 构建
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --parallel --build-cache

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: hires-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
