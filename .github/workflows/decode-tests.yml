name: 解码模块测试

on:
  push:
    paths:
      - 'src/core/decode/**'
      - 'tests/decode/**'
      - 'scripts/run-decode-tests.mjs'
      - 'scripts/ts-loader.mjs'
      - '.github/workflows/decode-tests.yml'
  pull_request:
    paths:
      - 'src/core/decode/**'
      - 'tests/decode/**'
  workflow_dispatch:

jobs:
  decode-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 依赖 node 内置的类型擦除能力直接运行 TS，无需安装 node_modules
          node-version: 22

      - name: 运行解码逻辑测试
        run: node --experimental-strip-types scripts/run-decode-tests.mjs
